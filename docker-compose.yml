services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo_app
    ports:
      - "5433:5432"
    volumes:
      - demo_app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo_app"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  demo_app_pgdata:
